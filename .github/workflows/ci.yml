name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security & Privacy Audit (SEC-015)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SEC-015 Single-Owner & Access Audit
        run: |
          echo "Checking for single-owner or portfolio code in application paths..."
          if grep -rnE "ADMIN_EMAIL|is_cms_owner|requireOwner|getOwner|ownerEmail|role: 'owner'|'portfolio'|/write\b|write_access|case-study-media|publishCaseStudy" \
               frontend/src backend/express/src backend/django/accounts backend/django/config packages/shared/src \
               --include='*.ts' --include='*.tsx' --include='*.py' | grep -v '/tests.py:'; then
            echo "Security Audit Failed: Found prohibited single-owner or portfolio keywords."
            exit 1
          fi
          echo "Security audit passed: 0 single-owner or portfolio keywords found."

  frontend:
    name: Frontend CI (Types, Lint, Tests & Build)
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck (@studio/frontend)
        run: npm run typecheck -w @studio/frontend

      - name: ESLint (@studio/frontend)
        run: npm run lint -w @studio/frontend

      - name: Frontend Schema & ZIP Tests
        run: |
          cd frontend
          node --import tsx --test test/schema.test.ts test/zip.test.ts

      - name: Next.js Production Build
        run: npm run build -w @studio/frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend:
    name: Backend CI (Express, Django & Shared)
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck (@studio/express-api & @studio/shared)
        run: |
          npm run typecheck -w @studio/express-api
          npm run typecheck -w @studio/shared

      - name: Shared Package Unit Tests (Documents, Blocks, Contract, Review, Analytics)
        run: node --import tsx --test packages/shared/test/*.test.ts

      - name: Build Express API
        run: npm run build -w @studio/express-api

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/django/requirements.txt

      - name: Install Django dependencies
        run: pip install -r backend/django/requirements.txt

      - name: Django System Checks
        run: |
          cd backend/django
          python manage.py check

      - name: Django Auth Test Suite (In-Memory SQLite)
        run: |
          cd backend/django
          python manage.py test accounts

  database:
    name: Database CI (PostgreSQL Migrations & Schema Lockdown)
    runs-on: ubuntu-latest
    needs: [security-audit]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/django/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/django/requirements.txt psycopg[binary]

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run Database CI Suite (Migrations, Dry Run & Schema Lockdown)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/studio_test
        run: bash scripts/db-ci-test.sh "$DATABASE_URL"

  ci-status:
    name: All CI Checks Passed
    needs: [security-audit, frontend, backend, database]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all CI jobs succeeded
        run: |
          if [ "${{ needs.security-audit.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.database.result }}" != "success" ]; then
            echo "CI Error: One or more CI jobs failed."
            echo "Security Audit: ${{ needs.security-audit.result }}"
            echo "Frontend:       ${{ needs.frontend.result }}"
            echo "Backend:        ${{ needs.backend.result }}"
            echo "Database:       ${{ needs.database.result }}"
            exit 1
          fi
          echo "All Frontend, Backend, and Database CI tests passed successfully."
